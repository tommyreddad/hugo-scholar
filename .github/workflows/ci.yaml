name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"
      - name: Install citeproc
        run: |
          cabal install citeproc-0.13.0.1 -fexecutable --ignore-project --install-method=copy --installdir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Regenerate example
        run: make generate
      - name: Check project
        env:
          HUGO_SCHOLAR_REQUIRE_INTEGRATION: "1"
        run: make check
