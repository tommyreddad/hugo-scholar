{{- $entry := .entry -}}
{{- $tag := .referenceTag -}}
{{- printf "<%s id=\"%s\">" $tag (printf "%s%s" .prefix $entry.key | htmlEscape) | safeHTML -}}
{{- .reference | safeHTML -}}
{{- printf "</%s>" $tag | safeHTML -}}
{{- with $entry.detail_url -}} <a class="details" href="{{ partial "scholar/url.html" . }}">Details</a>{{ end -}}
